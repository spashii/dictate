<!doctype html>
<!-- Source of site/og.png, the 1200x630 share image. Type and colour follow https://spashii.github.io/ds/v1.css;
     the drawing of the app keeps the app's own colours. Render with tools/og/render.cjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter Variable", "Inter", system-ui, sans-serif;
    --surface: #f5f5f7;
    --text: #1d1d1f;
    --hairline: #d2d2d7;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: var(--surface); color: var(--text); font: 400 17px/1.5 var(--font); -webkit-font-smoothing: antialiased; }

  .copy { position: absolute; left: 72px; top: 150px; width: 500px; height: 330px; display: flex; flex-direction: column; justify-content: center; }
  .copy img { width: 72px; height: 72px; display: block; }
  h1 { margin-top: 32px; font-size: 54px; line-height: 1.05; letter-spacing: -.025em; font-weight: 600; text-wrap: balance; }

  .frame { position: absolute; left: 598px; top: 150px; width: 422px; height: 330px; border-radius: 18px; background: #d9dde6; box-shadow: 0 24px 48px rgba(0, 0, 0, .08); }
  .win { position: absolute; left: 21px; top: 64px; width: 380px; height: 206px; border-radius: 10px; background: #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .12), 0 8px 24px rgba(0, 0, 0, .10); overflow: hidden; }
  .bar { height: 36px; border-bottom: 1px solid #e5e5ea; display: flex; align-items: center; justify-content: center; position: relative; font-size: 14px; font-weight: 600; }
  .lights { position: absolute; left: 12px; top: 12px; display: flex; gap: 7px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; }
  .lights i:nth-child(1) { background: #ff5f57; }
  .lights i:nth-child(2) { background: #febc2e; }
  .lights i:nth-child(3) { background: #28c840; }
  .field { position: absolute; left: 11px; right: 11px; bottom: 11px; height: 78px; border-radius: 12px; background: #f4f4f6; box-shadow: inset 0 0 0 1px #dcdce0; padding: 12px 40px 0 12px; font-size: 14px; line-height: 1.3; }
  .send { position: absolute; right: 22px; bottom: 22px; width: 24px; height: 24px; border-radius: 50%; background: #d1d1d6; display: grid; place-items: center; }
  .keys { position: absolute; left: 0; right: 0; top: 288px; display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 14px; }
  .keys kbd { font: inherit; background: #fff; border-radius: 6px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .10), 0 1px 2px rgba(0, 0, 0, .10); height: 28px; min-width: 32px; padding: 0 8px; display: grid; place-items: center; }
  .keys span { font-size: 12px; opacity: .6; }
</style>
</head>
<body>
  <div class="copy">
    <img src="../../site/icon.svg" alt="">
    <h1>Fast local dictation and call transcription for Mac.</h1>
  </div>
  <div class="frame">
    <div class="win">
      <div class="bar"><span class="lights"><i></i><i></i><i></i></span>Alex</div>
      <div class="field">Can you send me the slides before tomorrow’s call?</div>
      <div class="send"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10V2M2.5 5.5 6 2l3.5 3.5"/></svg></div>
    </div>
    <div class="keys"><kbd>Option</kbd><span>+</span><kbd>`</kbd></div>
  </div>
</body>
</html>
