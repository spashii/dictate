name: Site

# Publishes site/ to GitHub Pages whenever it changes on main.
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages caches every file for 10 minutes, so each deploy must name its own CSS and JS.
      - name: Version local CSS and JS by commit
        shell: bash
        run: |
          v="$(git rev-parse --short HEAD)"
          find site -name '*.html' -exec sed -i "s/__V__/${v}/g" {} +
          if grep -rn '__V__' site; then
            echo "unreplaced __V__ placeholder" >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
